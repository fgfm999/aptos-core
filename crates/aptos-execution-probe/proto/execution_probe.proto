syntax = "proto3";
package aptos.experimental.execution.v1;
import "aptos/transaction/v1/transaction.proto";

message SubscribeRequest {
  // Optional Indexer BooleanTransactionFilter config JSON. Applied before serialization,
  // in addition to the node startup filter. Empty preserves the default selection.
  string transaction_filter_json = 1;
  // Opt in to generation/boundary controls. Version 0 streams terminate on a boundary.
  uint32 boundary_protocol_version = 2;
}
enum DataFormat {
  JSON = 0;
  BCS = 1;
}
// Live-only, best-effort observations. Events are EXECUTED, never COMMITTED.
message TransactionId {
  bytes hash = 1;
  uint32 transaction_index = 2;
}
// No ledger version or commit roots are fabricated. These are executed results.
message ExecutedTransactionData {
  bytes hash = 1;
  uint32 transaction_index = 2;
  repeated aptos.transaction.v1.Event events = 3;
  repeated aptos.transaction.v1.WriteSetChange write_set_changes = 4;
  bool data_complete = 5;
  string conversion_error = 6;
  // Populated on incomplete conversion for consumers with their own BCS schemas.
  bytes raw_events_bcs = 7;
  bytes raw_write_set_bcs = 8;
  // BCS schema 1: aptos_types::transaction::TransactionOutput (v1.50.1).
  // Includes WriteSet, ContractEvents, gas_used and status; auxiliary_data is skipped.
  bytes execution_output_bcs = 9;
  // aptos_types::transaction::Transaction, for hash and entry-function identification.
  bytes transaction_bcs = 10;
}
// A real committed DB anchor. The execution root can be an epoch virtual root.
message CommittedAnchor {
  bytes canonical_block_id = 1;
  bytes execution_root_block_id = 2;
  uint64 version = 3;
  uint64 epoch = 4;
  uint64 round = 5;
}
enum BoundaryReason {
  BOUNDARY_REASON_UNSPECIFIED = 0;
  EXECUTOR_RESET = 1;
  EXECUTOR_FINISH = 2;
  EPOCH_ROOT = 3;
}
message StreamBoundary {
  BoundaryReason reason = 1;
  // Absent during executor_finish; no post-boundary data is valid until reset.
  CommittedAnchor anchor = 2;
}
message ProbeEvent {
  bool ready = 1;
  string session_id = 2;
  uint32 chain_id = 3;
  uint64 sequence = 4;
  bytes block_id = 5;
  bytes parent_block_id = 6;
  // Diagnostic only. Cross-host subtraction requires clock synchronization.
  uint64 execution_done_unix_nanos = 7;
  uint32 chunk_index = 8;
  bool last_chunk = 9;
  repeated TransactionId transactions = 10;
  uint64 dropped_blocks = 11;
  bool include_data = 12;
  repeated ExecutedTransactionData transaction_data = 13;
  DataFormat data_format = 14;
  uint32 bcs_schema_version = 15;
  // Ready-only startup filter in config JSON. Empty means no extra filter.
  string transaction_filter_json = 16;
  // Ready-only acknowledgement of the accepted per-subscription filter.
  string subscription_filter_json = 17;
  uint32 boundary_protocol_version = 18;
  uint64 stream_generation = 19;
  // Ready carries the latest boundary. A control frame has only identity,
  // format, generation, loss counters and boundary; sequence/chunks/data are empty.
  StreamBoundary boundary = 20;
}
service ExecutionProbe {
  rpc Subscribe(SubscribeRequest) returns (stream ProbeEvent);
}
